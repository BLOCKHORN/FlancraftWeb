<svg xmlns="http://www.w3.org/2000/svg" width="140" height="40" viewBox="0 0 104 30" preserveAspectRatio="none">
  <defs>
    <style>
      /* base más viva */
      .base{fill:#9a836e;}
      .hi{fill:#f4eadc;}
      .sh{fill:#6e5344;}

      /* borde exterior marcado */
      .ol{fill:none;stroke:#2B1712;stroke-width:2.25;stroke-linejoin:round;}

      /* bisel interior */
      .il{fill:none;stroke:rgba(255,255,255,.34);stroke-width:1.05;stroke-linejoin:round;}
      .id{fill:none;stroke:rgba(0,0,0,.18);stroke-width:1.05;stroke-linejoin:round;}

      /* mordiscos (agrietado en el borde, hacia dentro) */
      .chipD{fill:#2B1712;opacity:.24;}
      .chipL{fill:#ffffff;opacity:.14;}
    </style>

    <clipPath id="cut">
      <polygon points="4,0 100,0 104,4 104,26 100,30 4,30 0,26 0,4"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cut)">
    <!-- base -->
    <polygon class="base" points="4,0 100,0 104,4 104,26 100,30 4,30 0,26 0,4"/>

    <!-- highlight top-left -->
    <polygon class="hi" points="0,22 12,6 76,0 4,0 0,4" opacity="0.80"/>

    <!-- shadow bottom-right -->
    <polygon class="sh" points="104,8 92,25 20,30 100,30 104,26" opacity="0.92"/>

    <!-- ========= bordes “agrietados” (mordidos hacia dentro) ========= -->
    <!-- TOP chips -->
    <polygon class="chipD" points="18,0 25,0 22.2,2.4"/>
    <polygon class="chipL" points="18.6,0.7 24.3,0.7 22.2,2.0"/>

    <polygon class="chipD" points="49,0 56.5,0 53.8,2.1"/>
    <polygon class="chipL" points="49.7,0.7 55.8,0.7 53.8,1.8"/>

    <polygon class="chipD" points="78,0 85.8,0 82.6,2.6"/>
    <polygon class="chipL" points="78.8,0.7 85.0,0.7 82.6,2.1"/>

    <!-- LEFT chips -->
    <polygon class="chipD" points="0,9.5 0,15.3 2.6,12.3"/>
    <polygon class="chipL" points="0.7,10.2 0.7,14.7 2.1,12.3"/>

    <!-- RIGHT chips -->
    <polygon class="chipD" points="104,11 104,16.8 101.2,13.6"/>
    <polygon class="chipL" points="103.3,11.7 103.3,16.1 101.8,13.6"/>

    <!-- BOTTOM chips -->
    <polygon class="chipD" points="30,30 38.2,30 34.6,27.4"/>
    <polygon class="chipL" points="30.8,29.3 37.4,29.3 34.6,27.9"/>

    <polygon class="chipD" points="61,30 69.2,30 65.9,27.7"/>
    <polygon class="chipL" points="61.8,29.3 68.4,29.3 65.9,28.2"/>
  </g>

  <!-- borde exterior -->
  <polygon class="ol" points="4,0 100,0 104,4 104,26 100,30 4,30 0,26 0,4"/>

  <!-- bisel interior (claro arriba/izq) -->
  <path class="il" d="M4,1.2 H100 L102.8,4" />
  <path class="il" d="M1.2,26 L1.2,4 L4,1.2" />

  <!-- bisel interior (oscuro abajo/der) -->
  <path class="id" d="M100,28.8 H4 L1.2,26" />
  <path class="id" d="M102.8,4 V26 L100,28.8" />
</svg>
