<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="woodTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b77a3c"/>
      <stop offset="1" stop-color="#7a4a22"/>
    </linearGradient>
    <linearGradient id="woodFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c622f"/>
      <stop offset="1" stop-color="#5b3518"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset="0.55" stop-color="#ffcc4d"/>
      <stop offset="1" stop-color="#b77716"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ecf4"/>
      <stop offset="1" stop-color="#7f8a98"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="12" cy="20.2" rx="7.8" ry="1.7" fill="rgba(0,0,0,0.25)"/>

  <!-- chest top -->
  <path d="M5 8.2c0-1 0.8-1.8 1.8-1.8h10.4C18.2 6.4 19 7.2 19 8.2v2.1H5V8.2z"
        fill="url(#woodTop)" stroke="#1a0d07" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M7 7.7h10" stroke="rgba(255,255,255,0.28)" stroke-width="1" stroke-linecap="round"/>

  <!-- chest front -->
  <path d="M4.7 10.1H19.3v7.6c0 1-0.8 1.8-1.8 1.8H6.5c-1 0-1.8-0.8-1.8-1.8v-7.6z"
        fill="url(#woodFront)" stroke="#1a0d07" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- metal bands -->
  <path d="M7.2 10.1v9.4" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
  <path d="M16.8 10.1v9.4" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>

  <!-- lock plate -->
  <path d="M10 12.2h4c0.7 0 1.2 0.5 1.2 1.2v2.7c0 0.7-0.5 1.2-1.2 1.2h-4c-0.7 0-1.2-0.5-1.2-1.2v-2.7c0-0.7 0.5-1.2 1.2-1.2z"
        fill="url(#gold)" stroke="#1a0d07" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M12 13.1c0.8 0 1.4 0.6 1.4 1.4 0 0.55-0.3 1.0-0.75 1.22v0.85h-1.3v-0.85c-0.45-0.22-0.75-0.67-0.75-1.22 0-0.8 0.6-1.4 1.4-1.4z"
        fill="rgba(0,0,0,0.28)"/>

  <!-- sparkle star -->
  <path d="M19.4 6.1l0.65 1.45 1.55 0.18-1.15 1.05 0.33 1.52-1.38-0.8-1.38 0.8 0.33-1.52-1.15-1.05 1.55-0.18 0.65-1.45z"
        fill="url(#steel)" stroke="#1a0d07" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M19.4 6.9l0.35 0.78 0.84 0.1-0.62 0.57 0.18 0.82-0.75-0.43-0.75 0.43 0.18-0.82-0.62-0.57 0.84-0.1 0.35-0.78z"
