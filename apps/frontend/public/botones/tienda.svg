<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="c_wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4884a"/>
      <stop offset="1" stop-color="#8b562a"/>
    </linearGradient>
    <linearGradient id="c_lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a86a34"/>
      <stop offset="1" stop-color="#6f3f1f"/>
    </linearGradient>
    <linearGradient id="c_gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset=".55" stop-color="#ffd06a"/>
      <stop offset="1" stop-color="#d9a643"/>
    </linearGradient>
    <linearGradient id="c_steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7dee7"/>
      <stop offset="1" stop-color="#7e8894"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.15" stdDeviation="0.85" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- lid -->
    <path d="M6.2 6.4h11.6c.9 0 1.6.7 1.6 1.6v2H4.6V8c0-.9.7-1.6 1.6-1.6z"
          fill="url(#c_lid)" stroke="#2b1712" stroke-width="1.05"/>
    <path d="M6.8 7.6h10.4" stroke="#ffffff" opacity=".18" stroke-width="1.1" stroke-linecap="round"/>

    <!-- body -->
    <path d="M5.2 10h13.6v8.2c0 .9-.7 1.6-1.6 1.6H6.8c-.9 0-1.6-.7-1.6-1.6V10z"
          fill="url(#c_wood)" stroke="#2b1712" stroke-width="1.05"/>
    <!-- metal band -->
    <path d="M5.2 13.2h13.6" stroke="url(#c_steel)" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M5.2 13.2h13.6" stroke="#2b1712" opacity=".22" stroke-width="1.6" stroke-linecap="round"/>

    <!-- lock -->
    <path d="M10.2 12.1h3.6c.4 0 .7.3.7.7v4.2c0 .4-.3.7-.7.7h-3.6c-.4 0-.7-.3-.7-.7v-4.2c0-.4.3-.7.7-.7z"
          fill="url(#c_gold)" stroke="#2b1712" stroke-width="1"/>
    <circle cx="12" cy="15.1" r=".7" fill="#2b1712" opacity=".25"/>
    <circle cx="12" cy="15.1" r=".38" fill="#2b1712" opacity=".55"/>

    <!-- sparkle -->
    <path d="M18.8 5.2l.5 1.2 1.2.5-1.2.5-.5 1.2-.5-1.2-1.2-.5 1.2-.5.5-1.2z"
          fill="#fff2b8" stroke="#2b1712" stroke-width=".65" stroke-linejoin="round" opacity=".95"/>
  </g>
</svg>
