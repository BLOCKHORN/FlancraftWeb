<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="h_roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d85a4a"/>
      <stop offset="1" stop-color="#a9342a"/>
    </linearGradient>
    <linearGradient id="h_wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e1c089"/>
      <stop offset="1" stop-color="#b8894f"/>
    </linearGradient>
    <linearGradient id="h_grass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ff07a"/>
      <stop offset="1" stop-color="#35a84a"/>
    </linearGradient>
    <linearGradient id="h_dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a532f"/>
      <stop offset="1" stop-color="#5a311b"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="0.8" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- ground -->
  <path d="M3 15.2h18v1.8H3z" fill="url(#h_grass)"/>
  <path d="M3 17h18v4H3z" fill="url(#h_dirt)"/>
  <path d="M4 15.2h5" stroke="#b9ffb0" stroke-width="1" opacity=".45"/>
  <path d="M14 15.2h6" stroke="#b9ffb0" stroke-width="1" opacity=".35"/>

  <!-- house -->
  <g filter="url(#softShadow)">
    <!-- roof -->
    <path d="M12 5.2 5.2 9.2h13.6L12 5.2z" fill="url(#h_roof)" stroke="#2b1712" stroke-width="1" stroke-linejoin="round"/>
    <!-- walls -->
    <path d="M7.2 9.4h9.6v7.2H7.2z" fill="url(#h_wall)" stroke="#2b1712" stroke-width="1" stroke-linejoin="round"/>
    <!-- door -->
    <path d="M11 12.2h2v4.4h-2z" fill="#6a452c" stroke="#2b1712" stroke-width=".9"/>
    <circle cx="12.65" cy="14.35" r=".55" fill="#ffd06a" stroke="#2b1712" stroke-width=".6"/>
    <!-- window -->
    <path d="M8.4 11.4h2.1v2.1H8.4z" fill="#66d9ff" stroke="#2b1712" stroke-width=".85"/>
    <path d="M8.55 11.55h1.8v.8h-1.8z" fill="#b9f2ff" opacity=".9"/>
  </g>
</svg>
