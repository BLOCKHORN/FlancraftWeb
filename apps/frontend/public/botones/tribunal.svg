<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="t_steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5ff"/>
      <stop offset="1" stop-color="#8b97a6"/>
    </linearGradient>
    <linearGradient id="t_base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aab3bd"/>
      <stop offset="1" stop-color="#6e7782"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="0.8" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- beam -->
    <path d="M6.2 7.1h11.6c.6 0 1 .4 1 1v.7H5.2v-.7c0-.6.4-1 1-1z"
          fill="url(#t_steel)" stroke="#2b1712" stroke-width="1"/>

    <!-- pillar -->
    <path d="M11 8.7h2v8.1h-2z" fill="url(#t_steel)" stroke="#2b1712" stroke-width="1"/>

    <!-- chains -->
    <path d="M8.1 9.3v2.4" stroke="#c7d0da" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M15.9 9.3v2.4" stroke="#c7d0da" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M8.1 11.7l-1.2 1.1" stroke="#c7d0da" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M15.9 11.7l1.2 1.1" stroke="#c7d0da" stroke-width="1.4" stroke-linecap="round"/>

    <!-- pans -->
    <path d="M5.4 13.2c0-.5.4-.9.9-.9h3.2c.5 0 .9.4.9.9 0 1.4-1.2 2.6-2.5 2.6S5.4 14.6 5.4 13.2z"
          fill="url(#t_base)" stroke="#2b1712" stroke-width="1" />
    <path d="M13.6 13.2c0-.5.4-.9.9-.9h3.2c.5 0 .9.4.9.9 0 1.4-1.2 2.6-2.5 2.6s-2.5-1.2-2.5-2.6z"
          fill="url(#t_base)" stroke="#2b1712" stroke-width="1" />

    <!-- base -->
    <path d="M7 17h10v2.5H7z" fill="url(#t_base)" stroke="#2b1712" stroke-width="1"/>
    <path d="M8 19.5h8" stroke="#2b1712" opacity=".25" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
