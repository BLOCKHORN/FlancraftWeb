<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="s_stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c3ce"/>
      <stop offset="1" stop-color="#7e8894"/>
    </linearGradient>
    <linearGradient id="s_bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9f2ff"/>
      <stop offset="1" stop-color="#43c7ff"/>
    </linearGradient>
    <linearGradient id="s_bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfffb0"/>
      <stop offset="1" stop-color="#55cf64"/>
    </linearGradient>
    <linearGradient id="s_bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eddcff"/>
      <stop offset="1" stop-color="#b58cff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="0.8" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- tablet -->
    <path d="M6 4.5h12c1 0 1.8.8 1.8 1.8v11.4c0 1-.8 1.8-1.8 1.8H6c-1 0-1.8-.8-1.8-1.8V6.3C4.2 5.3 5 4.5 6 4.5z"
          fill="url(#s_stone)" stroke="#2b1712" stroke-width="1.05"/>
    <path d="M6.6 6.5h10.8" stroke="#ffffff" opacity=".25" stroke-width="1" stroke-linecap="round"/>

    <!-- grid baseline -->
    <path d="M7 17h10" stroke="#2b1712" opacity=".28" stroke-width="1.1" stroke-linecap="round"/>

    <!-- bars -->
    <path d="M8 16v-4.6c0-.4.3-.7.7-.7h1.3c.4 0 .7.3.7.7V16H8z" fill="url(#s_bar1)" stroke="#2b1712" stroke-width=".9"/>
    <path d="M11.4 16V8.9c0-.4.3-.7.7-.7h1.3c.4 0 .7.3.7.7V16h-2.7z" fill="url(#s_bar2)" stroke="#2b1712" stroke-width=".9"/>
    <path d="M14.8 16v-3.2c0-.4.3-.7.7-.7h1.0c.4 0 .7.3.7.7V16h-2.4z" fill="url(#s_bar3)" stroke="#2b1712" stroke-width=".9"/>

    <!-- tiny trophy mark -->
    <path d="M9.3 7.2h5.4c.2 0 .4.2.4.4v.8c0 1.1-.9 2-2 2h-2.2c-1.1 0-2-.9-2-2v-.8c0-.2.2-.4.4-.4z"
          fill="#ffd06a" stroke="#2b1712" stroke-width=".85"/>
    <path d="M11 10.4h2" stroke="#2b1712" opacity=".25" stroke-width="1.1" stroke-linecap="round"/>
  </g>
</svg>
