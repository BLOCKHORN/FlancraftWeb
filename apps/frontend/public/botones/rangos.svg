<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="b_cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd0d0"/>
      <stop offset=".35" stop-color="#ff7a7a"/>
      <stop offset="1" stop-color="#b23a3a"/>
    </linearGradient>
    <linearGradient id="b_pole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b6a3f"/>
      <stop offset="1" stop-color="#5c341c"/>
    </linearGradient>
    <linearGradient id="b_star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5ff"/>
      <stop offset="1" stop-color="#c7d0da"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="0.8" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- pole -->
    <path d="M6.3 4.4c.8 0 1.4.6 1.4 1.4v15H6.3v-16.4z" fill="url(#b_pole)" stroke="#2b1712" stroke-width="1"/>
    <path d="M7.7 6.3h2.2" stroke="#2b1712" stroke-width="1" stroke-linecap="round" opacity=".35"/>

    <!-- banner -->
    <path d="M9 6.2h9.4c.8 0 1.4.6 1.4 1.4v8.4c0 .7-.4 1.1-1.1 1.2l-1.8.2-2.2 2.2-2.2-2.2-2.3.2c-.8 0-1.2-.5-1.2-1.3V7.6c0-.8.6-1.4 1.4-1.4z"
          fill="url(#b_cloth)" stroke="#2b1712" stroke-width="1.05" stroke-linejoin="round"/>
    <path d="M10.2 8.1h8" stroke="#ffffff" opacity=".18" stroke-width="1.1" stroke-linecap="round"/>

    <!-- emblem -->
    <path d="M13.7 9.6l1.1 1.7 2 .5-1.3 1.5.1 2-1.9-.8-1.9.8.1-2-1.3-1.5 2-.5 1.1-1.7z"
          fill="url(#b_star)" stroke="#2b1712" stroke-width=".9" stroke-linejoin="round"/>
  </g>
</svg>
