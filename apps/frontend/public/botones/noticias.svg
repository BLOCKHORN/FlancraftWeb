<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="p_paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d8"/>
      <stop offset="1" stop-color="#e6d0a6"/>
    </linearGradient>
    <linearGradient id="p_pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b5f"/>
      <stop offset="1" stop-color="#b0322a"/>
    </linearGradient>
    <linearGradient id="p_ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b3a2a"/>
      <stop offset="1" stop-color="#2b1712"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="0.8" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- parchment -->
    <path d="M6.2 4.3h11.2c.9 0 1.6.7 1.6 1.6v12.2c0 .9-.7 1.6-1.6 1.6H6.2c-.9 0-1.6-.7-1.6-1.6V5.9c0-.9.7-1.6 1.6-1.6z"
          fill="url(#p_paper)" stroke="#2b1712" stroke-width="1.05" />
    <!-- curled highlight -->
    <path d="M6.3 6.2c1.8-.7 3.7-1 5.7-1" stroke="#ffffff" opacity=".35" stroke-width="1" stroke-linecap="round"/>

    <!-- pin -->
    <path d="M7.3 3.7c.9 0 1.6.7 1.6 1.6S8.2 6.9 7.3 6.9 5.7 6.2 5.7 5.3s.7-1.6 1.6-1.6z"
          fill="url(#p_pin)" stroke="#2b1712" stroke-width=".9"/>
    <path d="M7.3 6.7v2.0" stroke="#2b1712" stroke-width=".9" stroke-linecap="round" opacity=".6"/>

    <!-- lines -->
    <path d="M7.3 9h9.4" stroke="#b99f74" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M7.3 11.2h8.2" stroke="#b99f74" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M7.3 13.4h9.4" stroke="#b99f74" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M7.3 15.6h6.2" stroke="#b99f74" stroke-width="1.2" stroke-linecap="round"/>

    <!-- quill -->
    <path d="M15.3 6.6c1.8.2 3.1 1.6 3.1 3.2 0 1.3-.9 2.6-2.4 3.3l-2.4 1.1.7-2.2c-.6-.6-1-1.4-1-2.3 0-1.7 1.5-3.2 3.4-3.1z"
          fill="#eaf2ff" stroke="#2b1712" stroke-width=".95" stroke-linejoin="round"/>
    <path d="M13.6 14.2l1.7-1.2" stroke="url(#p_ink)" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
