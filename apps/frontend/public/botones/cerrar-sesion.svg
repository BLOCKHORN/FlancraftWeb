<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="doorWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b77a3c"/>
      <stop offset="1" stop-color="#6b3f1d"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ecf4"/>
      <stop offset="1" stop-color="#7b8696"/>
    </linearGradient>
    <linearGradient id="arrowRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd0d0"/>
      <stop offset="0.5" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#b62020"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="12" cy="20.3" rx="7.2" ry="1.6" fill="rgba(0,0,0,0.25)"/>

  <!-- door frame -->
  <path d="M6.2 4.7h7.2c1.2 0 2.1 0.9 2.1 2.1v12.9c0 0.9-0.7 1.6-1.6 1.6H6.2V4.7z"
        fill="url(#doorWood)" stroke="#1a0d07" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M7.5 6.3h6.2" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-linecap="round"/>

  <!-- inner panels -->
  <path d="M7.2 7.2h6.5v5.1H7.2V7.2z" fill="rgba(0,0,0,0.18)"/>
  <path d="M7.2 13.2h6.5v6.2H7.2v-6.2z" fill="rgba(0,0,0,0.22)"/>

  <!-- knob -->
  <circle cx="13" cy="12.7" r="0.85" fill="url(#iron)" stroke="#1a0d07" stroke-width="0.8"/>

  <!-- arrow out -->
  <path d="M11.8 11.6h6.1" stroke="url(#arrowRed)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M16.6 9.6l3 2-3 2" fill="none" stroke="url(#arrowRed)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- arrow outline for readability -->
  <path d="M11.8 11.6h6.1" stroke="#1a0d07" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
  <path d="M16.6 9.6l3 2-3 2" fill="none" stroke="#1a0d07" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
